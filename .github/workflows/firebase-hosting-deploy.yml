name: Deploy to Firebase Hosting

# 触发：推送到 main 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 写入（如需 Pages 等，这里仅部署用，保持最小权限）
permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest   # GitHub 的境外服务器，可直连 Google，不受你本机网络限制
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          # 只部署 hosting；用 secret 里的项目 ID 覆盖 .firebaserc 占位
          args: deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          # 在仓库 Settings > Secrets 里配置：
          #   FIREBASE_TOKEN      = firebase login:ci 生成的部署令牌
          #   FIREBASE_PROJECT_ID = 你的 Firebase 项目 ID（如 pursys-web）
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
